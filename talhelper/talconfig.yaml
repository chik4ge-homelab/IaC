---
clusterName: talos-k8s
endpoint: https://192.168.1.101:6443

talosVersion: v1.13.0 # renovate: datasource=github-releases packageName=siderolabs/talos
kubernetesVersion: v1.35.0 # renovate: datasource=github-releases packageName=kubernetes/kubernetes

cniConfig:
  name: none

inlineManifests:
  - name: onepassword-namespace
    contents: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: onepassword-connect
  - name: external-secrets-namespace
    contents: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: external-secrets
  - name: op-credentials-secret
    contents: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: op-credentials
        namespace: onepassword-connect
      type: Opaque
      data:
        1password-credentials.json: ${op_credentials_json}
  - name: onepassword-connect-token-homelab
    contents: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: onepassword-connect-token-homelab
        namespace: external-secrets
      type: Opaque
      data:
        token: ${op_access_token}

nodes:
  - hostname: k8s-cp-argon
    controlPlane: true
    ipAddress: 192.168.1.101
    installDisk: /dev/sda

  - hostname: k8s-cp-boron
    controlPlane: true
    ipAddress: 192.168.1.102
    installDisk: /dev/sda

  - hostname: k8s-cp-carbon
    controlPlane: true
    ipAddress: 192.168.1.103
    installDisk: /dev/sda

  - hostname: k8s-w-anemone
    controlPlane: false
    ipAddress: 192.168.1.201
    installDisk: /dev/sda
    nodeLabels:
      chik4ge.me/node-tier: small

  - hostname: k8s-w-blossom
    controlPlane: false
    ipAddress: 192.168.1.202
    installDisk: /dev/sda
    nodeLabels:
      chik4ge.me/iot-access: "true"
    patches:
      - |-
        machine:
          network:
            interfaces:
              - interface: eth1
                dhcp: false
                addresses:
                  - 192.168.3.20/24
          sysctls:
            net.ipv6.conf.all.forwarding: "0"
            net.ipv6.conf.eth1.accept_ra: "1"
            net.ipv6.conf.eth1.accept_ra_rt_info_max_plen: "64"

  - hostname: k8s-w-clover
    controlPlane: false
    ipAddress: 192.168.1.203
    installDisk: /dev/sda

  # - hostname: k8s-w-daisy
  #   controlPlane: false
  #   ipAddress: 192.168.1.204
  #   installDisk: /dev/sda

  - hostname: k8s-w-edelweiss
    controlPlane: false
    ipAddress: 192.168.1.205
    installDisk: /dev/sda
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/nonfree-kmod-nvidia-production
            - siderolabs/nvidia-container-toolkit-production
            - siderolabs/qemu-guest-agent
            - siderolabs/iscsi-tools
    patches:
      - |-
        machine:
          kernel:
            modules:
              - name: nvidia
              - name: nvidia_uvm
              - name: nvidia_drm
              - name: nvidia_modeset
          sysctls:
            net.core.bpf_jit_harden: 1

  - hostname: k8s-w-freesia
    controlPlane: false
    ipAddress: 192.168.1.206
    installDisk: /dev/sda
    nodeLabels:
      chik4ge.me/iot-access: "true"
    patches:
      - |-
        machine:
          network:
            interfaces:
              - interface: eth1
                dhcp: false
                addresses:
                  - 192.168.3.21/24
          sysctls:
            net.ipv6.conf.all.forwarding: "0"
            net.ipv6.conf.eth1.accept_ra: "1"
            net.ipv6.conf.eth1.accept_ra_rt_info_max_plen: "64"

  # - hostname: k8s-w-zinnia
  #   controlPlane: false
  #   ipAddress: 64.110.107.81
  #   installDisk: /dev/sda

controlPlane:
  machineSpec:
    mode: nocloud
    arch: amd64
  # extensionServices:
  #   - name: tailscale
  #     environment:
  #       - TS_AUTHKEY=${tsAuth}
  #       - TS_ROUTES=10.96.0.0/12
  networkInterfaces:
    - deviceSelector:
        physical: true
      vip:
        ip: 192.168.1.100
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/qemu-guest-agent
          # - siderolabs/tailscale
  patches:
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:etcd:backup
            allowedKubernetesNamespaces:
              - talos-backup
      cluster:
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1beta1
                kind: PodSecurityConfiguration
                exemptions:
                  namespaces:
                    - democratic-csi
                    - tailscale
                    - openebs
    - |-
      cluster:
        apiServer:
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 3Gi
        controllerManager:
          resources:
            limits:
              memory: 512Mi
        scheduler:
          resources:
            limits:
              memory: 512Mi
    - |-
      cluster:
        proxy:
          disabled: true
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0

worker:
  machineSpec:
    mode: nocloud
    arch: amd64
  # extensionServices:
  #   - name: tailscale
  #     environment:
  #       - TS_AUTHKEY=${tsAuth}
  #       - TS_ROUTES=10.96.0.0/12
  volumes:
    - name: EPHEMERAL
      provisioning:
        diskSelector:
          match: disk.transport == 'virtio' && !system_disk
        minSize: 32G
        grow: true
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/qemu-guest-agent
  patches:
    - |-
      cluster:
        proxy:
          disabled: true
      machine:
        sysctls:
          fs.inotify.max_user_watches: 524288
          user.max_user_namespaces: 28633
          vm.nr_hugepages: "1024"
        nodeLabels:
          openebs.io/engine: "mayastor"
        kubelet:
          nodeIP:
            validSubnets:
              - 192.168.1.0/24
          extraMounts:
            - destination: /var/local
              type: bind
              source: /var/local
              options:
                - bind
                - rshared
                - rw
